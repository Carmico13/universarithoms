<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quin número és?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenidor-joc">
        <h1>Identifica el bit</h1>
        
        <div id="capcalera-info">
            <span id="progres">Pregunta 1 de 2</span>
            <span id="temps">Temps: 25s</span> <!-- NOU: Element del temporitzador -->
            <span id="puntuacio">Punts: 0</span>
        </div>

        <div id="zona-pregunta">
            <h2 id="text-pregunta">Aquí anirà la pregunta...</h2>
            <img id="imatge-pregunta" class="ocult" src="" alt="Imatge de la pregunta">
            <div id="opcions-container" class="graella-opcions">
                <!-- Els botons de les respostes s'afegiran des de JavaScript -->
                <button class="btn-opcio">Opció 1</button>
                <button class="btn-opcio">Opció 2</button>
                <button class="btn-opcio">Opció 3</button>
                <button class="btn-opcio">Opció 4</button>
            </div>
        </div>

        <button id="btn-seguent" class="ocult">Següent pregunta</button>
    </div>

   <script src="script.js"></script>
</body>
</html>
