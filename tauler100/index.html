<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tauler del 100 Interactiu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #1e3a8a;
        }

        .counter {
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: 600;
            color: #4b5563;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .cell {
            aspect-ratio: 1;
            background-color: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cell:hover {
            background-color: #e2e8f0;
            border-color: #cbd5e1;
            transform: scale(1.05);
        }

        .cell.selected {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
            transform: scale(0.95);
        }

        .btn-reset {
            margin-top: 25px;
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.2);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-reset:hover {
            background-color: #dc2626;
        }

        .btn-reset:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .grid {
                gap: 5px;
                padding: 10px;
            }
            .cell {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <h1>Tauler del 100</h1>

    <div class="grid" id="grid"></div>

    <button class="btn-reset" id="resetBtn">Reiniciar Tauler</button>

    <script>
        const grid = document.getElementById('grid');
        const counter = document.getElementById('counter');
        const resetBtn = document.getElementById('resetBtn');

        let selectedNumbers = new Set();

        // Generar les 100 caselles
        for (let i = 1; i <= 100; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.textContent = i;
            
            cell.addEventListener('click', () => {
                if (selectedNumbers.has(i)) {
                    selectedNumbers.delete(i);
                    cell.classList.remove('selected');
                } else {
                    selectedNumbers.add(i);
                    cell.classList.add('selected');
                }
                updateCounter();
            });

            grid.appendChild(cell);
        }

        // Funció per actualitzar el comptador
        function updateCounter() {
            counter.textContent = `Nombres seleccionats: ${selectedNumbers.size} / 100`;
        }

        // Botó per reiniciar
        resetBtn.addEventListener('click', () => {
            selectedNumbers.clear();
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('selected');
            });
            updateCounter();
        });
    </script>

</body>
</html>
